
name: Build AutoScout iOS project

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build AutoScout for iOS
    runs-on: macos-latest

    steps:
      - name: Check out AutoScout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool

      - name: Set up Kivy iOS toolchain
        run: |
          python3 -m venv "$RUNNER_TEMP/kivy-ios-venv"
          source "$RUNNER_TEMP/kivy-ios-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install Cython==3.0.11 kivy-ios

      - name: Build iOS libraries and Kivy
        run: |
          source "$RUNNER_TEMP/kivy-ios-venv/bin/activate"
          toolchain build python3 kivy

      - name: Create AutoScout Xcode project
        run: |
          source "$RUNNER_TEMP/kivy-ios-venv/bin/activate"
          toolchain create AutoScout "$GITHUB_WORKSPACE"

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: AutoScout-iOS-XcodeProject
          path: AutoScout-ios/
          if-no-files-found: error

